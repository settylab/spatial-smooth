name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  LOKY_MAX_CPU_COUNT: "2"
  JAX_PLATFORMS: cpu

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        # The Gaussian-process steps skip themselves when kompot is absent; the `gp` job below
        # covers them. Everything else -- composition, persistence, scale invariance, kwargs
        # forwarding, dependency errors -- runs here.
        run: pytest -q -rs

  gp:
    name: pytest with the GP backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (kompot from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,dm]"
      - name: Show the GP backend version under test
        run: python -c "import kompot; print(kompot.__version__, hasattr(kompot, 'smooth_expression'))"
      - name: Test
        # No skips allowed here: this job exists to exercise the GP steps.
        run: pytest -q -rs
