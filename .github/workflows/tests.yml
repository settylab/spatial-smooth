name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPLBACKEND: Agg
  LOKY_MAX_CPU_COUNT: "2"
  JAX_PLATFORMS: cpu

jobs:
  test:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Test
        # The Gaussian-process steps skip themselves when kompot is absent; the `gp` job below
        # covers them. Everything else -- composition, persistence, scale invariance, kwargs
        # forwarding, dependency errors -- runs here.
        run: pytest -q -rs

  gp:
    name: pytest with the GP backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (kompot from source until 0.8.0 reaches PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install "kompot @ git+https://github.com/settylab/kompot.git"
      - name: Test
        run: pytest -q -rs

  docs:
    name: build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build
        run: make -C docs html
      - uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/build/html
