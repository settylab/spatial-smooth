name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The published site is PUBLIC even though this repository is private (GitHub Team and above).
# Nothing in docs/ or notebooks/ may reference internal identifiers.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # spatial_smooth imports with no third-party packages present (everything is lazily
        # required), so the docs build needs only Sphinx and friends.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"
      - name: Build
        run: make -C docs html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    name: deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
